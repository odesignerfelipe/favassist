name: Deploy (Easypanel)

# Implantação contínua: quando o CI do `main` passa, aciona o gatilho de implantação do Easypanel.
# Configure em GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   EASYPANEL_DEPLOY_URL = URL do "Gatilho de Implantação" do serviço `app` no Easypanel
# Sem o segredo, o workflow apenas avisa e não faz nada.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Só implanta código que passou no CI (ou acionamento manual)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Acionar a implantação no Easypanel
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::EASYPANEL_DEPLOY_URL não configurado — implantação automática desativada."
            exit 0
          fi
          code=$(curl -sS --max-time 60 -o response.txt -w '%{http_code}' -X POST "$DEPLOY_URL" || echo 000)
          if [ "$code" = "404" ] || [ "$code" = "405" ]; then
            code=$(curl -sS --max-time 60 -o response.txt -w '%{http_code}' "$DEPLOY_URL" || echo 000)
          fi
          echo "Easypanel respondeu HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Falha ao acionar a implantação (HTTP $code). Confira o segredo EASYPANEL_DEPLOY_URL."
            exit 1
          fi
          echo "Implantação acionada. Acompanhe no Easypanel → serviço app → Histórico de Implantação."
