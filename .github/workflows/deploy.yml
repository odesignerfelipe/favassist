name: Deploy (VPS)

# Implantação contínua na VPS via SSH.
# Configure em Settings → Secrets and variables → Actions:
#   VPS_HOST (IP da VPS), VPS_USER (ex.: root), VPS_SSH_KEY (chave privada com acesso à VPS)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verificar segredos
        id: check
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "Segredos da VPS não configurados — implantação ignorada."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Atualizar a VPS
        if: steps.check.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: BRANCH=main /opt/fav-assist/deploy/update.sh
