server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Uploads de evidências (fotos e vídeos) — acompanhar UPLOAD_MAX_MB da API
  client_max_body_size 60m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # DNS interno do Docker resolvido a cada requisição: o nginx sobe mesmo se a API ainda estiver iniciando.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $fav_api http://fav-assist-api:3333;

  # API no mesmo domínio: cookies SameSite=Strict funcionam sem CORS
  location /api/ {
    proxy_pass $fav_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Service worker e manifest nunca em cache (atualizações do PWA)
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
